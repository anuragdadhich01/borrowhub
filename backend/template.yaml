AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  borrow-hub
  Backend API for the BorrowHub application

Globals:
  Api:
    Cors:
      AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      AllowHeaders: "'Content-Type,Authorization,Accept,X-Requested-With,X-Custom-Header,Cache-Control,Pragma'"
      AllowOrigin: "'https://borrowhubb.live'"
      AllowCredentials: true
      MaxAge: "'86400'"
  Function:
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        CORS_ALLOWED_ORIGINS: "https://borrowhubb.live,http://localhost:5173,http://127.0.0.1:5173"
        JWT_SECRET: !Ref JWTSecret
        S3_BUCKET: !Ref FileStorageBucket

Parameters:
  JWTSecret:
    Type: String
    Default: "change-this-in-production-jwt-secret-key"
    Description: "JWT secret key for token signing"
    NoEcho: true

Resources:
  # S3 Bucket for file storage
  FileStorageBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      # Use hardcoded lowercase name to avoid S3 naming issues with stack names
      BucketName: !Sub "borrowhub-files-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - GET
              - PUT
              - POST
              - DELETE
              - HEAD
            AllowedOrigins:
              - "https://borrowhubb.live"
              - "http://localhost:5173"
              - "http://127.0.0.1:5173"
            MaxAge: 3600
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 30

  # S3 Bucket Policy for public read access to images
  FileStorageBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FileStorageBucket
      PolicyDocument:
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: "*"
            Action:
              - s3:GetObject
            Resource: !Sub "${FileStorageBucket}/public/*"

  BorrowHubbFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: bootstrap
      Runtime: provided.al2
      Timeout: 30
      MemorySize: 512
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ItemsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref BookingsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PaymentsTable
        - S3CrudPolicy:
            BucketName: !Ref FileStorageBucket
      Environment:
        Variables:
          ITEMS_TABLE_NAME: !Ref ItemsTable
          USERS_TABLE_NAME: !Ref UsersTable
          BOOKINGS_TABLE_NAME: !Ref BookingsTable
          PAYMENTS_TABLE_NAME: !Ref PaymentsTable
          S3_BUCKET_NAME: !Ref FileStorageBucket
          JWT_SECRET: !Ref JWTSecret
          CORS_ALLOWED_ORIGINS: "https://borrowhubb.live,http://localhost:5173,http://127.0.0.1:5173"
      Events:
        Api:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: any

  ItemsTable:
    Type: AWS::Serverless::SimpleTable
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AWS::StackName}-items"
      PrimaryKey:
        Name: id
        Type: String

  UsersTable:
    Type: AWS::Serverless::SimpleTable
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AWS::StackName}-users"
      PrimaryKey:
        Name: email
        Type: String

  BookingsTable:
    Type: AWS::Serverless::SimpleTable
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AWS::StackName}-bookings"
      PrimaryKey:
        Name: id
        Type: String

  PaymentsTable:
    Type: AWS::Serverless::SimpleTable
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AWS::StackName}-payments"
      PrimaryKey:
        Name: id
        Type: String

Outputs:
  BorrowHubApi:
    Description: "API Gateway endpoint URL for Prod stage for BorrowHub function"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
    
  S3BucketName:
    Description: "S3 Bucket for file storage"
    Value: !Ref FileStorageBucket
    
  S3BucketDomain:
    Description: "S3 Bucket domain for file access"
    Value: !Sub "${FileStorageBucket}.s3.${AWS::Region}.amazonaws.com"